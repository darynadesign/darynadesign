<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squiggly Arrow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      min-height: 100vh;
      padding: 60px;
      background: #f5f5f0;
    }
  </style>
</head>
<body>
  <svg id="svg1" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
  <svg id="svg2" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>

  <script>
    // ─── CONFIG ──────────────────────────────────────────────────────────────
    const WIDTH_2 = 536;
    const WIDTH_1 = WIDTH_2 * 1.3;

    // ─── CONSTANTS ───────────────────────────────────────────────────────────
    const AMPLITUDE       = 2.5;
    const SPEED           = 0.055;
    const SCALE           = 4;   // display px per viewBox unit
    const ARROWHEAD_ROOM  = 14.48; // viewBox units needed past last BASE point

    // BASE waypoints at full line length; x will be scaled per instance
    const BASE_FULL = [
      { x: 2,      y: 14.73 },
      { x: 29.12,  y: 15.17 },
      { x: 47.2,   y: 16.70 },
      { x: 65.28,  y: 14.82 },
      { x: 83.36,  y: 11.13 },
      { x: 101.44, y: 14.18 },
      { x: 119.52, y: 14.42 },
    ];

    // ─── HELPERS ─────────────────────────────────────────────────────────────
    function catmullRom(pts) {
      let d = `M ${pts[0].x.toFixed(3)} ${pts[0].y.toFixed(3)}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(0, i - 1)];
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const p3 = pts[Math.min(pts.length - 1, i + 2)];
        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;
        d += ` C ${cp1x.toFixed(3)} ${cp1y.toFixed(3)} ${cp2x.toFixed(3)} ${cp2y.toFixed(3)} ${p2.x.toFixed(3)} ${p2.y.toFixed(3)}`;
      }
      return d;
    }

    function buildArrowhead(pts) {
      const last  = pts[pts.length - 1];
      const ref   = pts[pts.length - 2];
      const angle = Math.atan2(last.y - ref.y, last.x - ref.x);
      const cos = Math.cos(angle), sin = Math.sin(angle);
      function r(dx, dy) {
        return `${(last.x + dx*cos - dy*sin).toFixed(3)},${(last.y + dx*sin + dy*cos).toFixed(3)}`;
      }
      return [
        `M ${r( 4.242,  1.414)}`,
        `C ${r( 5.023,  0.633)} ${r( 5.023, -0.633)} ${r( 4.242, -1.414)}`,
        `L ${r(-8.486, -14.142)}`,
        `C ${r(-9.267,-14.923)} ${r(-10.533,-14.923)} ${r(-11.314,-14.142)}`,
        `C ${r(-12.095,-13.361)} ${r(-12.095,-12.095)} ${r(-11.314,-11.314)}`,
        `L ${r( 0,      0)}`,
        `L ${r(-11.314, 11.314)}`,
        `C ${r(-12.095, 12.095)} ${r(-12.095, 13.361)} ${r(-11.314, 14.142)}`,
        `C ${r(-10.533, 14.923)} ${r(-9.267,  14.923)} ${r( -8.486, 14.142)}`,
        `Z`,
      ].join(' ');
    }

    // ─── SETUP ───────────────────────────────────────────────────────────────
    function initArrow(svgEl, width) {
      const vbWidth    = width / SCALE;
      const lineLength = vbWidth - ARROWHEAD_ROOM;
      svgEl.setAttribute('width',   width);
      svgEl.setAttribute('height',  192);
      svgEl.setAttribute('viewBox', `-6 -6 ${vbWidth + 6} 42`);

      const wavePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      wavePath.setAttribute('fill', 'none');
      wavePath.setAttribute('stroke', '#7274FF');
      wavePath.setAttribute('stroke-width', '4');
      wavePath.setAttribute('stroke-linecap', 'round');
      wavePath.setAttribute('stroke-linejoin', 'round');

      const arrowhead = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      arrowhead.setAttribute('fill', '#7274FF');

      svgEl.appendChild(wavePath);
      svgEl.appendChild(arrowhead);

      // Scale x values proportionally, keep y identical
      const base = BASE_FULL.map(p => ({
        x: p.x * (lineLength / 119.52),
        y: p.y,
      }));

      return { wavePath, arrowhead, base, vbWidth };
    }

    const arrow1 = initArrow(document.getElementById('svg1'), WIDTH_1);
    const arrow2 = initArrow(document.getElementById('svg2'), WIDTH_2);

    // ─── ANIMATION ───────────────────────────────────────────────────────────
    let phase = 0;

    function animate() {
      phase += SPEED;

      [arrow1, arrow2].forEach(({ wavePath, arrowhead, base, vbWidth }) => {
        const pts = base.map(p => ({
          x: p.x,
          y: p.y + AMPLITUDE * Math.sin(2 * Math.PI * (p.x / vbWidth) * 2 - phase),
        }));
        wavePath.setAttribute('d', catmullRom(pts));
        arrowhead.setAttribute('d', buildArrowhead(pts));
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>

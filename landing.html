<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MM Landing — Daria Forsiuk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="index.html" class="logo">df.</a>
    <span class="nav-label">PORTFOLIO '26</span>
    <ul class="nav-links">
      <li><a href="index.html#about">ABOUT</a></li>
      <li><a href="index.html#work">WORK</a></li>
      <li><a href="index.html#contact">CONTACT</a></li>
    </ul>
    <a href="assets/cv.pdf" class="nav-cta" target="_blank">VIEW MY CV</a>
    <button class="nav-hamburger" aria-label="Open menu">MENU</button>
  </nav>

  <!-- MOBILE MENU OVERLAY -->
  <div class="menu-overlay" id="menuOverlay" aria-hidden="true">
    <div class="menu-overlay-header">
      <a href="index.html" class="menu-overlay-logo">df.</a>
      <button class="menu-overlay-close" id="menuClose" aria-label="Close menu">MENU <span class="menu-close-dot"></span></button>
    </div>
    <div class="menu-overlay-nav">
      <a href="index.html#about" class="menu-overlay-link">ABOUT</a>
      <a href="index.html#cases" class="menu-overlay-link">CASES</a>
      <a href="index.html#skills" class="menu-overlay-link">SKILLS</a>
    </div>
    <div class="menu-overlay-footer">
      <a href="index.html#contact" class="menu-overlay-cta">GET IN TOUCH</a>
      <div class="menu-overlay-externals">
        <a href="https://www.linkedin.com/in/daria-forsiuk/" class="menu-overlay-external" target="_blank">LINKEDIN <img src="assets/arrow 1.svg" alt="" class="arrow-icon" /></a>
        <a href="assets/cv.pdf" class="menu-overlay-external" target="_blank">VIEW MY CV <img src="assets/arrow 2.svg" alt="" class="arrow-icon" /></a>
      </div>
    </div>
  </div>

  <script>
    const nav = document.querySelector('nav');
    const menuOverlay = document.getElementById('menuOverlay');
    const menuOpen = document.querySelector('.nav-hamburger');
    const menuClose = document.getElementById('menuClose');

    const navSections = [];

    function updateNav() {
      nav.classList.add('has-bg', 'dark');

      const navRect = nav.getBoundingClientRect();
      const navMidY = navRect.top + navRect.height / 2;
      for (const section of navSections) {
        if (!section.el) continue;
        const rect = section.el.getBoundingClientRect();
        if (rect.top <= navMidY && rect.bottom > navMidY) {
          nav.classList.toggle('dark', section.dark);
          return;
        }
      }
    }

    window.addEventListener('scroll', updateNav, { passive: true });
    updateNav();

    function openMenu() {
      menuOverlay.classList.add('is-open');
      menuOverlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      menuOverlay.classList.remove('is-open');
      menuOverlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    menuOpen.addEventListener('click', () => {
      menuOverlay.classList.contains('is-open') ? closeMenu() : openMenu();
    });

    menuClose.addEventListener('click', closeMenu);

    menuOverlay.querySelectorAll('.menu-overlay-link, .menu-overlay-cta').forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    document.addEventListener('click', (e) => {
      if (menuOverlay.classList.contains('is-open') &&
          !menuOverlay.contains(e.target) &&
          !menuOpen.contains(e.target)) {
        closeMenu();
      }
    });
  </script>
</body>
</html>

  <!-- MOBILE MENU OVERLAY -->
  <div class="menu-overlay" id="menuOverlay" aria-hidden="true">
    <div class="menu-overlay-header">
      <a href="index.html" class="menu-overlay-logo">df.</a>
      <button class="menu-overlay-close" id="menuClose" aria-label="Close menu">MENU <span class="menu-close-dot"></span></button>
    </div>
    <div class="menu-overlay-nav">
      <a href="index.html#about" class="menu-overlay-link">ABOUT</a>
      <a href="index.html#cases" class="menu-overlay-link">CASES</a>

    <div class="menu-overlay-footer">
      <a href="index.html#contact" class="menu-overlay-cta">GET IN TOUCH</a>
      <div class="menu-overlay-externals">
        <a href="https://www.linkedin.com/in/daria-forsiuk/" class="menu-overlay-external" target="_blank">LINKEDIN <img src="assets/arrow 1.svg" alt="" class="arrow-icon" /></a>
        <a href="assets/cv.pdf" class="menu-overlay-external" target="_blank">VIEW MY CV <img src="assets/arrow 2.svg" alt="" class="arrow-icon" /></a>
      </div>
    </div>

  <script>
    const nav = document.querySelector('nav');
    const menuOverlay = document.getElementById('menuOverlay');
    const menuOpen = document.querySelector('.nav-hamburger');
    const menuClose = document.getElementById('menuClose');

    const navSections = [];

    function updateNav() {
      nav.classList.add('has-bg', 'dark');

      const navRect = nav.getBoundingClientRect();
      const navMidY = navRect.top + navRect.height / 2;
      for (const section of navSections) {
        if (!section.el) continue;
        const rect = section.el.getBoundingClientRect();
        if (rect.top <= navMidY && rect.bottom > navMidY) {
          nav.classList.toggle('dark', section.dark);
          return;
        }
      }
    }

    window.addEventListener('scroll', updateNav, { passive: true });
    updateNav();

    // Hide nav on scroll-down, show on scroll-up / mouse-move
    let lastScrollY = window.scrollY;
    window.addEventListener('scroll', () => {
      const currentY = window.scrollY;
      if (currentY > lastScrollY && currentY > 80) {
        nav.classList.add('hidden');
      } else {
        nav.classList.remove('hidden');
      }
      lastScrollY = currentY;
    }, { passive: true });

    document.addEventListener('mousemove', () => {
      nav.classList.remove('hidden');
    });

    function openMenu() {
      menuOverlay.classList.add('is-open');
      menuOverlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      menuOverlay.classList.remove('is-open');
      menuOverlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    menuOpen.addEventListener('click', () => {
      menuOverlay.classList.contains('is-open') ? closeMenu() : openMenu();
    });

    menuClose.addEventListener('click', closeMenu);

    menuOverlay.querySelectorAll('.menu-overlay-link, .menu-overlay-cta').forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    document.addEventListener('click', (e) => {
      if (menuOverlay.classList.contains('is-open') &&
          !menuOverlay.contains(e.target) &&
          !menuOpen.contains(e.target)) {
        closeMenu();
      }
    });
  </script>

  <script>
    const gridDebug = document.getElementById('gridDebug');
    document.addEventListener('keydown', (e) => {
      if (e.key === 'g' || e.key === 'G') {
        gridDebug.classList.toggle('is-visible');
      }
    });

    // Squiggly wave animation for "view case" button
    (function() {
      const ARROW_SPEED = 0.165;
      const FRAME_MS = 1000 / 60;
      const BASE = [
        { x: 1.57,  y: 14.73 },
        { x: 22.87, y: 15.17 },
        { x: 37.08, y: 16.70 },
        { x: 51.28, y: 14.82 },
        { x: 65.49, y: 11.13 },
        { x: 79.69, y: 14.18 },
        { x: 93.88, y: 14.42 },
      ];
      const AMPLITUDE = 3.04;
      const FREQUENCY = 2.8;
      const SPEED = ARROW_SPEED;

      function catmullRom(pts) {
        let d = `M ${pts[0].x.toFixed(3)} ${pts[0].y.toFixed(3)}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[Math.max(0, i - 1)];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[Math.min(pts.length - 1, i + 2)];
          const cp1x = p1.x + (p2.x - p0.x) / 6;
          const cp1y = p1.y + (p2.y - p0.y) / 6;
          const cp2x = p2.x - (p3.x - p1.x) / 6;
          const cp2y = p2.y - (p3.y - p1.y) / 6;
          d += ` C ${cp1x.toFixed(3)} ${cp1y.toFixed(3)} ${cp2x.toFixed(3)} ${cp2y.toFixed(3)} ${p2.x.toFixed(3)} ${p2.y.toFixed(3)}`;
        }
        return d;
      }

      function buildArrowhead(pts) {
        const last  = pts[pts.length - 1];
        const ref   = pts[pts.length - 2];
        const angle = Math.atan2(last.y - ref.y, last.x - ref.x);
        const cos = Math.cos(angle), sin = Math.sin(angle);
        function r(dx, dy) {
          return `${(last.x + dx*cos - dy*sin).toFixed(3)},${(last.y + dx*sin + dy*cos).toFixed(3)}`;
        }
        return [
          `M ${r( 4.242,  1.414)}`,
          `C ${r( 5.023,  0.633)} ${r( 5.023, -0.633)} ${r( 4.242, -1.414)}`,
          `L ${r(-8.486, -14.142)}`,
          `C ${r(-9.267,-14.923)} ${r(-10.533,-14.923)} ${r(-11.314,-14.142)}`,
          `C ${r(-12.095,-13.361)} ${r(-12.095,-12.095)} ${r(-11.314,-11.314)}`,
          `L ${r( 0,      0)}`,
          `L ${r(-11.314, 11.314)}`,
          `C ${r(-12.095, 12.095)} ${r(-12.095, 13.361)} ${r(-11.314, 14.142)}`,
          `C ${r(-10.533, 14.923)} ${r(-9.267,  14.923)} ${r( -8.486, 14.142)}`,
          `Z`,
        ].join(' ');
      }

      function drawStatic(wavePath, arrowhead) {
        const pts = BASE.map(p => ({
          x: p.x,
          y: p.y + AMPLITUDE * Math.sin(2 * Math.PI * (p.x / 108.36) * FREQUENCY),
        }));
        wavePath.setAttribute('d', catmullRom(pts));
        arrowhead.setAttribute('d', buildArrowhead(pts));
      }

      document.querySelectorAll('.case-link').forEach(link => {
        const wavePath  = link.querySelector('.cases-wave');
        const arrowhead = link.querySelector('.cases-arrowhead');
        if (!wavePath || !arrowhead) return;

        drawStatic(wavePath, arrowhead);

        let phase = 0, rafId = null, animating = false, lastTime = 0;

        function animateFrame(now) {
          if (!animating) return;
          if (now - lastTime < FRAME_MS) { rafId = requestAnimationFrame(animateFrame); return; }
          lastTime = now;
          phase += SPEED;
          const pts = BASE.map(p => ({
            x: p.x,
            y: p.y + AMPLITUDE * Math.sin(2 * Math.PI * (p.x / 108.36) * FREQUENCY - phase),
          }));
          wavePath.setAttribute('d', catmullRom(pts));
          arrowhead.setAttribute('d', buildArrowhead(pts));
          rafId = requestAnimationFrame(animateFrame);
        }

        link.addEventListener('mouseenter', () => {
          animating = true;
          if (!rafId) rafId = requestAnimationFrame(animateFrame);
        });

        link.addEventListener('mouseleave', () => {
          animating = false;
          if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        });
      });
    }());


  </script>
</body>
